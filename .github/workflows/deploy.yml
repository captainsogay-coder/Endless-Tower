name: Deploy to GitHub Pages

# Builds the game and publishes it so it works with EITHER GitHub Pages setting:
#   - Source "Deploy from a branch" → served from the gh-pages branch (always updated)
#   - Source "GitHub Actions"       → deployed directly by the second job
# If Pages is switched off, the run summary says exactly which setting to change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Detect how GitHub Pages is configured
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ -z "$mode" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 && mode=legacy
          fi
          echo "mode=${mode:-none}" >> "$GITHUB_OUTPUT"
          case "$mode" in
            workflow) echo "Pages source: GitHub Actions – deploying in the next job." ;;
            legacy)   echo "Pages source: gh-pages branch – the site updates from the branch just pushed." ;;
            *)        echo "::warning::GitHub Pages is switched off. Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Source to 'Deploy from a branch', Branch 'gh-pages', folder '/ (root)', then Save." ;;
          esac
          echo "Site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - if: steps.mode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
