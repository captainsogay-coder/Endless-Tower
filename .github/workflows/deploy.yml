name: Deploy to GitHub Pages

# Builds the game and publishes dist/ to the `gh-pages` branch, which GitHub
# Pages serves at https://<owner>.github.io/<repo>/.
# If Pages is not yet enabled, the last step tries to enable it; if GitHub
# refuses (the default token cannot change repository settings), it prints
# the one setting to change: Settings → Pages → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Make sure GitHub Pages serves the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled."
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1; then
            echo "Enabled GitHub Pages from the gh-pages branch."
          else
            echo "::warning::GitHub Pages is not enabled yet. In the repository go to Settings → Pages → Build and deployment → Source: 'Deploy from a branch', Branch: gh-pages, folder: / (root), then Save."
          fi
          echo "Site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
